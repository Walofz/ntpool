<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zpool proxy dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>zpool proxy dashboard</h1>
    <p class="subtitle">WalletEX viewer and Stratum proxy status page.</p>

    <section class="card">
      <div class="row">
        <label for="address-input">Wallet address</label>
        <input id="address-input" type="text" placeholder="Leave empty to use ZPOOL_WALLET_ADDRESS">
      </div>
      <div class="row buttons">
        <button id="refresh-btn" type="button">Refresh</button>
        <button id="auto-btn" type="button">Auto: OFF</button>
      </div>
      <p id="status-text" class="status">Ready</p>
    </section>

    <section class="card stats">
      <div><span class="label">Total paid</span><strong id="total-paid">-</strong></div>
      <div><span class="label">Balance</span><strong id="balance">-</strong></div>
      <div><span class="label">Unpaid</span><strong id="unpaid">-</strong></div>
    </section>

    <section class="card">
      <h2>Raw WalletEX JSON</h2>
      <pre id="json-output">No data loaded.</pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
