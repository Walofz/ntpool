<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>ntpool · minimal</title>
  <link rel="stylesheet" href="minimal.css" />
  <script>
    // Apply the stored theme before first paint to avoid a flash of the wrong scheme.
    (function () {
      try {
        var t = localStorage.getItem('ntpool-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) { /* storage blocked — fall back to the system preference */ }
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <div class="brand">
        <span class="live-dot" id="live-dot" role="status" aria-label="connection status"></span>
        <h1 id="pool-name">ntpool</h1>
        <span class="net" id="network">—</span>
      </div>
      <div class="pills">
        <span class="pill" id="pill-rpc"><i></i>RPC</span>
        <span class="pill" id="pill-zmq"><i></i>ZMQ</span>
        <span class="pill" id="pill-pool"><i></i>Pool</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </div>
    </header>

    <section class="stats" aria-label="Pool metrics">
      <article class="stat">
        <p class="label">Hashrate <span>5m</span></p>
        <p class="value" id="hashrate">—</p>
        <p class="sub" id="hashrate-sub">1m —</p>
      </article>
      <article class="stat">
        <p class="label">Workers</p>
        <p class="value" id="workers">—</p>
        <p class="sub" id="workers-sub">—</p>
      </article>
      <article class="stat">
        <p class="label">Block height</p>
        <p class="value" id="height">—</p>
        <p class="sub" id="height-sub">Diff —</p>
      </article>
      <article class="stat">
        <p class="label">Blocks found</p>
        <p class="value" id="blocks">—</p>
        <p class="sub" id="blocks-sub">—</p>
      </article>
    </section>

    <section class="bar" id="market-bar" aria-label="Market price">
      <span class="bar-label" id="market-pair">Market —</span>
      <span class="bar-value" id="market-price">—</span>
      <span class="bar-meta" id="market-meta">Waiting for market API</span>
    </section>

    <section class="panel" aria-labelledby="workers-title">
      <div class="panel-head">
        <h2 id="workers-title">Workers</h2>
        <span class="panel-meta" id="workers-meta">0 active</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Worker</th>
              <th>Status</th>
              <th class="num">5m</th>
              <th class="num">Diff</th>
              <th class="num">Acc / Rej</th>
              <th class="num">Uptime</th>
            </tr>
          </thead>
          <tbody id="workers-body">
            <tr><td colspan="6" class="empty">No miners connected yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel" aria-labelledby="activity-title">
      <div class="panel-head">
        <h2 id="activity-title">Activity</h2>
        <span class="panel-meta" id="activity-meta">live</span>
      </div>
      <ul class="events" id="events">
        <li class="event muted"><span class="dot"></span><span>Waiting for pool events…</span></li>
      </ul>
    </section>

    <footer>
      <span>stratum <span id="stratum-port">—</span></span>
      <a href="/">full dashboard →</a>
    </footer>
  </main>

  <script src="minimal.js"></script>
</body>
</html>
