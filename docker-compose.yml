services:
  zpool-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zpool-proxy
    restart: unless-stopped
    ports:
      - "${STRATUM_PORT:-3333}:3333"
      - "${WEB_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - STRATUM_PORT=3333
      - WEB_PORT=8080
      - ZPOOL_API_BASE_URL=${ZPOOL_API_BASE_URL:-https://www.zpool.ca/api}
      - ZPOOL_API_USERNAME=${ZPOOL_API_USERNAME:-}
      - ZPOOL_API_PASSWORD=${ZPOOL_API_PASSWORD:-}
      - ZPOOL_WALLET_ADDRESS=${ZPOOL_WALLET_ADDRESS:-}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - ZPOOL_NOTIFY_PAYOUT=${ZPOOL_NOTIFY_PAYOUT:-true}
      - ZPOOL_POLL_SECONDS=${ZPOOL_POLL_SECONDS:-60}
      - ZPOOL_STRATUM_HOST=${ZPOOL_STRATUM_HOST:-sha256.mine.zpool.ca}
      - ZPOOL_STRATUM_PORT=${ZPOOL_STRATUM_PORT:-3256}
      - ZPOOL_STRATUM_USERNAME=${ZPOOL_STRATUM_USERNAME:-}
      - ZPOOL_STRATUM_PASSWORD=${ZPOOL_STRATUM_PASSWORD:-c=BTC}
      - NTFY_SERVER=${NTFY_SERVER:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-zpool-proxy-blocks}
      - NTFY_USER=${NTFY_USER:-}
      - NTFY_PASSWORD=${NTFY_PASSWORD:-}
    volumes:
      - ./data:/app/data
