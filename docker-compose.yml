services:
  zpool-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zpool-proxy
    restart: unless-stopped
    ports:
      - "${STRATUM_PORT:-3333}:3333"
      - "${WEB_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - STRATUM_PORT=3333
      - WEB_PORT=8080
      - DEFAULT_DIFF=${DEFAULT_DIFF:-1024}
      - ENABLE_VARDIFF=${ENABLE_VARDIFF:-false}
      - MIN_DIFF=${MIN_DIFF:-64}
      - MAX_DIFF=${MAX_DIFF:-1048576}
      - VARDIFF_TARGET_SHARES=${VARDIFF_TARGET_SHARES:-12}
      - RPC_HOST=${RPC_HOST:-127.0.0.1}
      - RPC_PORT=${RPC_PORT:-8332}
      - RPC_USER=${RPC_USER:-bitcoinrpc}
      - RPC_PASSWORD=${RPC_PASSWORD:-rpcpassword}
      - RPC_NETWORK=${RPC_NETWORK:-mainnet}
      - RPC_ALGO=${RPC_ALGO:-sha256d}
      - ZMQ_HOST=${ZMQ_HOST:-127.0.0.1}
      - ZMQ_PORT=${ZMQ_PORT:-28332}
      - POOL_NAME=${POOL_NAME:-zpool proxy SHA-256 Solo Pool}
      - COIN_SYMBOL=${COIN_SYMBOL:-BTC}
      - COINBASE_TEXT=${COINBASE_TEXT:-/zpool-proxy/}
      - POOL_FEE_PERCENT=${POOL_FEE_PERCENT:-0.0}
      - POOL_FEE_ADDRESS=${POOL_FEE_ADDRESS:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-AWPuDcCymof8BRF9cfkxnLqmhn7ZPVPjEr}
    volumes:
      - ./data:/app/data
    # Uncomment if connecting to Bitcoin Core running on the host machine
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
